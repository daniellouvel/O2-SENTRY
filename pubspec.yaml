name: o2_sentry
description: "Analyseur O2 Nitrox - Sentry"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # On force la version 1.30.0 sans le "^" pour éviter les mises à jour vers des versions instables
  flutter_blue_plus: 1.30.0
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.2.8
  permission_handler: ^12.0.1
  google_fonts: ^6.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true